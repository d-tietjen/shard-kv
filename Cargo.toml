[workspace]
members = [
    "benchmarks",
    "crates/shardcache-client-rs",
    "crates/shardcache-c",
    "crates/shardcache-formal",
    "crates/shardcache-py",
    "crates/shardcache-runtime",
    "crates/shardcache",
    "crates/shardmap",
]
resolver = "3"

[workspace.package]
version = "0.7.0"
edition = "2024"
authors = ["Devon Tietjen <devon@eden.dev>"]
homepage = "https://github.com/d-tietjen/shard-kv"
license = "Apache-2.0"
repository = "https://github.com/d-tietjen/shard-kv"
rust-version = "1.90"

[workspace.dependencies]
shardcache = { path = "crates/shardcache", version = "0.7.0" }
shardmap = { path = "crates/shardmap", version = "0.7.0", default-features = false }
shardcache-client-rs = { path = "crates/shardcache-client-rs", version = "0.7.0" }
fast-telemetry = "0.7.1"

clap = { version = "4.5", features = ["derive"] }
core_affinity = "0.8"
crc32fast = "1.4"
crossbeam-channel = "0.5"
crossbeam-utils = "0.8"
hashbrown = "0.14"
indextreemap = { version = "0.2.0", default-features = false }
log = "0.4"
libc = "0.2"
lz4_flex = "0.11"
parking_lot = "0.12"
rblock = "0.1.0"
redis-client = { package = "redis", version = "0.32.7", default-features = false, features = ["tls-rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.15"
thiserror = "2.0"
tokio = { version = "1.48", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = "0.13"
cust = "0.3.2"

[profile.release]
strip = true
# Fat LTO enables cross-crate inlining through storage, protocol, and
# persistence hot paths. It costs extra compile time, but keeps release
# binaries representative of production builds.
lto = "fat"
# Single codegen unit removes intra-crate split points the optimizer otherwise
# leaves at call boundaries. It adds compile time but gives maximum inlining
# visibility for release builds.
codegen-units = 1
# Abort on panic instead of unwinding. This eliminates unwind tables and keeps
# server binaries smaller; production deployments should rely on process
# supervision for restart behavior.
panic = "abort"

[profile.bench]
inherits = "release"
strip = false
codegen-units = 1
