# Shared Docker benchmark defaults. The suite runner accepts CLI flags with the
# same names to override these values for one run.

suites = "redis-core"
targets = "redis,redis-cluster,valkey,dragonfly,shardcache-resp,shardcache-scnp"
vcpus = "1,2,4,8,16"
clients = 1
pipeline_depths = "1"
warmup = 1
duration = 5
key_shards = "vcpus"
fixture_scope = "per-client"
memory_budget_mib = 256
command_budget = 0
out_dir = "benchmarks/results"
