[package]
name = "shardcache-benchmarks"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Head-to-head benchmarks for shardmap/shardcache against embedded Rust caches and networked databases. Not published."
publish = false

[features]
default = []
# Build the fc-embed backend on top of shardmap's reviewed unsafe hot paths.
# Run the bench twice (default + --features unsafe) to get both rows.
unsafe = ["shardmap/unsafe"]
# Build shardmap's shared embedded hot path in no-TTL mode for point-key
# workloads that never create expiring entries.
no-ttl = ["shardmap/no-ttl"]
# Build shardmap's experimental point-key-only no-TTL hot path.
experimental-no-ttl-point-hot-path = ["shardmap/experimental-no-ttl-point-hot-path"]
# Rebuild shardmap's shared embedded store with parking_lot::RwLock stripes
# for cache-level lock A/B runs against the default read-biased lock.
shared-parking-lot-lock = ["shardmap/shared-parking-lot-lock"]
# Rebuild shardcache's server/direct EmbeddedStore with read-biased shard locks
# for A/B runs against the default parking_lot lock.
embedded-read-biased-lock = ["shardmap/embedded-read-biased-lock"]
# Build benchmark binaries with shardcache's Linux-only monoio transport code
# available. Runtime selection is still controlled by the relevant env vars.
monoio = ["shardmap/monoio"]
# Build benchmark binaries with prefix-aware memory-limit eviction available.
prefix-eviction = ["shardmap/prefix-eviction"]
# Build benchmark binaries with shardmap telemetry available. Telemetry cost
# rows use explicit `*-telemetry` backends so ordinary rows remain inactive.
telemetry = ["shardmap/telemetry"]
object-overflow = ["shardmap/object-overflow"]
kv-overflow = ["shardmap/kv-overflow"]
kv-overflow-redis = ["kv-overflow", "shardmap/kv-overflow-redis"]
scnp-tls = ["kv-overflow", "shardmap/scnp-tls", "shardcache-client-rs/tls"]
active-sync-causal-eventual = ["shardmap/active-sync-causal-eventual"]
active-sync-consensus-ordered-eventual = [
    "active-sync-causal-eventual",
    "shardmap/active-sync-consensus-ordered-eventual",
]
# Build the benchmark-only server that exposes a caller-owned shardmap store
# through the shardcache RESP/SCNP server path.
embedded-server = ["shardmap/redis-server"]
# Build the embedded Redis command benchmark with every Redis function/module
# command family enabled so command coverage matches the server matrix.
redis-embedded-commands = [
    "shardmap/redis",
    "shardmap/redis-functions",
    "shardmap/redis-modules-all",
]

[dependencies]
shardmap = { workspace = true, features = ["sharded", "codec"] }
shardcache-client-rs = { workspace = true }
bytes = "1"
clap = { workspace = true }
core_affinity = { workspace = true }
crossbeam-channel = { workspace = true }
dashmap = "6.1"
hdrhistogram = "7.5"
libc = { workspace = true }
lru = "0.12"
moka = { version = "0.12", default-features = false, features = ["sync"] }
parking_lot = { workspace = true }
rand = { version = "0.8", features = ["small_rng"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
xxhash-rust = { workspace = true }

[[bin]]
name = "saturation"
path = "src/bin/saturation.rs"

[[bin]]
name = "curve"
path = "src/bin/curve.rs"

[[bin]]
name = "replication_cost"
path = "src/bin/replication_cost.rs"

[[bin]]
name = "active_sync_cost"
path = "src/bin/active_sync_cost.rs"
required-features = ["active-sync-consensus-ordered-eventual"]

[[bin]]
name = "active_sync_conflict_cost"
path = "src/bin/active_sync_conflict_cost.rs"
required-features = ["active-sync-consensus-ordered-eventual"]

[[bin]]
name = "replication_tcp_cost"
path = "src/bin/replication_tcp_cost.rs"

[[bin]]
name = "wal_tcp_export_cost"
path = "src/bin/wal_tcp_export_cost.rs"

[[bin]]
name = "memory_write_cost"
path = "src/bin/memory_write_cost.rs"

[[bin]]
name = "object_overflow_fs_cost"
path = "src/bin/object_overflow_fs_cost.rs"
required-features = ["object-overflow"]

[[bin]]
name = "kv_overflow_primary_cost"
path = "src/bin/kv_overflow_primary_cost.rs"
required-features = ["kv-overflow"]

[[bin]]
name = "redis_command_matrix"
path = "src/bin/redis_command_matrix.rs"

[[bin]]
name = "redis_embedded_command_matrix"
path = "src/bin/redis_embedded_command_matrix.rs"
required-features = ["redis-embedded-commands"]

[[bin]]
name = "redis_command_manifest"
path = "src/bin/redis_command_manifest.rs"

[[bin]]
name = "redis_command_report"
path = "src/bin/redis_command_report.rs"

[[bin]]
name = "scnp_scan_matrix"
path = "src/bin/scnp_scan_matrix.rs"

[[bin]]
name = "semantic_cache_matrix"
path = "src/bin/semantic_cache_matrix.rs"

[[bin]]
name = "semantic_server_load"
path = "src/bin/semantic_server_load.rs"

[[bin]]
name = "embedded_server_harness"
path = "src/bin/embedded_server_harness.rs"
required-features = ["embedded-server"]

[[bin]]
name = "embedded_mixed_harness"
path = "src/bin/embedded_mixed_harness.rs"
required-features = ["embedded-server"]
