services:
  redis:
    image: redis:7.4-alpine
    container_name: bench-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no", "--port", "6379"]

  valkey:
    image: valkey/valkey:8.0-alpine
    container_name: bench-valkey
    ports:
      - "127.0.0.1:6381:6381"
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--port", "6381"]

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.27.0
    container_name: bench-dragonfly
    ports:
      - "127.0.0.1:6382:6382"
    command: ["--port=6382", "--proactor_threads=4", "--snapshot_cron="]
