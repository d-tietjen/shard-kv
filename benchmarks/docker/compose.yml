services:
  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    container_name: bench-redis
    profiles: ["redis", "servers"]
    ports:
      - "127.0.0.1:6379:6379"
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--protected-mode",
        "no",
        "--port",
        "6379",
      ]

  redis-cluster:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    container_name: bench-redis-cluster
    profiles: ["redis-cluster", "servers"]
    ports:
      - "127.0.0.1:7000-7015:7000-7015"
    environment:
      REDIS_CLUSTER_NODES: ${REDIS_CLUSTER_NODES:-3}
      REDIS_CLUSTER_SLOT_LANES: ${REDIS_CLUSTER_SLOT_LANES:-3}
      REDIS_CLUSTER_BASE_PORT: ${REDIS_CLUSTER_BASE_PORT:-7000}
    command: |
      sh -lc '
        set -eu
        nodes="$${REDIS_CLUSTER_NODES:-3}"
        slot_lanes="$${REDIS_CLUSTER_SLOT_LANES:-$$nodes}"
        base="$${REDIS_CLUSTER_BASE_PORT:-7000}"
        if [ "$$nodes" -lt 3 ] || [ "$$nodes" -gt 16 ]; then
          echo "REDIS_CLUSTER_NODES must be between 3 and 16" >&2
          exit 2
        fi
        if [ "$$slot_lanes" -lt 1 ] || [ "$$slot_lanes" -gt "$$nodes" ]; then
          echo "REDIS_CLUSTER_SLOT_LANES must be between 1 and REDIS_CLUSTER_NODES" >&2
          exit 2
        fi

        pids=""
        for index in $$(seq 0 "$$((nodes - 1))"); do
          port="$$((base + index))"
          dir="/tmp/redis-cluster/$$port"
          mkdir -p "$$dir"
          redis-server \
            --cluster-enabled yes \
            --cluster-config-file nodes.conf \
            --cluster-node-timeout 5000 \
            --appendonly no \
            --save "" \
            --protected-mode no \
            --bind 0.0.0.0 \
            --port "$$port" \
            --cluster-announce-ip 127.0.0.1 \
            --cluster-announce-port "$$port" \
            --cluster-announce-bus-port "$$((port + 10000))" \
            --dir "$$dir" &
          pids="$$pids $$!"
        done

        sleep 1
        for index in $$(seq 1 "$$((nodes - 1))"); do
          redis-cli -p "$$base" CLUSTER MEET 127.0.0.1 "$$((base + index))" >/dev/null
        done

        add_slots() {
          port="$$1"
          start="$$2"
          end="$$3"
          slot="$$start"
          chunk=""
          count=0
          while [ "$$slot" -le "$$end" ]; do
            chunk="$$chunk $$slot"
            count="$$((count + 1))"
            if [ "$$count" -ge 512 ]; then
              redis-cli -p "$$port" CLUSTER ADDSLOTS $$chunk >/dev/null
              chunk=""
              count=0
            fi
            slot="$$((slot + 1))"
          done
          if [ "$$count" -gt 0 ]; then
            redis-cli -p "$$port" CLUSTER ADDSLOTS $$chunk >/dev/null
          fi
        }

        for index in $$(seq 0 "$$((slot_lanes - 1))"); do
          port="$$((base + index))"
          start="$$((index * 16384 / slot_lanes))"
          end="$$((((index + 1) * 16384 / slot_lanes) - 1))"
          add_slots "$$port" "$$start" "$$end"
        done

        for _ in $$(seq 1 100); do
          if redis-cli -p "$$base" CLUSTER INFO 2>/dev/null | grep -q "^cluster_state:ok"; then
            wait $$pids
          fi
          sleep 0.1
        done
        echo "redis cluster did not become healthy" >&2
        exit 1
      '

  redis-stack:
    image: ${REDIS_STACK_IMAGE:-redis/redis-stack-server:latest}
    container_name: bench-redis-stack
    profiles: ["redis-stack", "servers"]
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      # Redis Stack loads RedisBloom, RediSearch, RedisJSON, and RedisTimeSeries
      # at startup. The suite runner disables snapshots after startup so the
      # empty save policy is passed through redis-cli instead of REDIS_ARGS.
      REDIS_ARGS: "--appendonly no --protected-mode no --port 6379"

  valkey:
    image: ${VALKEY_IMAGE:-valkey/valkey:8.0-alpine}
    container_name: bench-valkey
    profiles: ["valkey", "servers"]
    ports:
      - "127.0.0.1:6381:6381"
    command:
      [
        "valkey-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--protected-mode",
        "no",
        "--port",
        "6381",
      ]

  dragonfly:
    image: ${DRAGONFLY_IMAGE:-docker.dragonflydb.io/dragonflydb/dragonfly:v1.27.0}
    container_name: bench-dragonfly
    profiles: ["dragonfly", "servers"]
    ports:
      - "127.0.0.1:6382:6382"
    command:
      [
        "--port=6382",
        "--proactor_threads=${DRAGONFLY_THREADS:-1}",
        "--snapshot_cron=",
        "--dbfilename=",
      ]

  memcached:
    image: ${MEMCACHED_IMAGE:-memcached:1.6-alpine}
    container_name: bench-memcached
    profiles: ["memcached", "servers"]
    ports:
      - "127.0.0.1:${MEMCACHED_PORT:-11211}:11211"
    command:
      [
        "memcached",
        "-m",
        "${MEMCACHED_MEMORY_MB:-1024}",
        "-p",
        "11211",
        "-u",
        "memcache",
        "-t",
        "${MEMCACHED_THREADS:-1}",
        "-c",
        "${MEMCACHED_MAX_CONNECTIONS:-4096}",
        "-I",
        "${MEMCACHED_MAX_ITEM_SIZE:-64m}",
      ]

  shardcache:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SHARDCACHE_FEATURES: ${SHARDCACHE_FEATURES:-redis-server}
    image: shardcache-bench:local
    container_name: bench-shardcache
    profiles: ["shardcache", "servers"]
    ports:
      - "127.0.0.1:${SHARDCACHE_PORT:-6383}:6383"
      - "127.0.0.1:6501-6516:6501-6516"
    environment:
      SHARDCACHE_DIRECT_SHARD_PORTS: "1"
      SHARDCACHE_DIRECT_SHARD_BASE_PORT: "6501"
    command:
      [
        "--bind-addr",
        "0.0.0.0:6383",
        "--shard-count",
        "${SHARD_COUNT:-1}",
        "--disable-persistence",
        "--server-mode",
        "direct",
      ]
