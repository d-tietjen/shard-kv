[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shardcache-lmcache-backend"
version = "0.1.0"
description = "LMCache storage plugin backed by shardcache"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Devon Tietjen", email = "devon@eden.dev" }]
keywords = ["lmcache", "kv-cache", "storage", "shardcache"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = [
  "shardcache_scnp_store",
  "shardcache_local_embedded_store",
  "shardcache_local_store",
  "shardcache_owned_store",
]

[tool.setuptools.packages.find]
where = ["src"]
