[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-cache-vllm-connector"
version = "0.1.0"
description = "Thin Python control shim for the direct fast-cache vLLM connector"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Devon Tietjen", email = "devon@eden.dev" }]
keywords = ["vllm", "kv-cache", "fast-cache", "connector"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
