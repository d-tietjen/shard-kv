services:
  shardcache:
    image: shardcache:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SHARDCACHE_FEATURES: ${SHARDCACHE_FEATURES:-redis-server}
        RUSTFLAGS: ${RUSTFLAGS:-}
    restart: unless-stopped
    ports:
      - "${SHARDCACHE_HOST:-127.0.0.1}:${SHARDCACHE_PORT:-6380}:${SHARDCACHE_PORT:-6380}"
      # Keep this range length equal to SHARDCACHE_SHARD_COUNT.
      # The server reads SHARDCACHE_DIRECT_SHARD_BASE_PORT; this range only
      # controls which host/container ports Compose publishes.
      - "${SHARDCACHE_HOST:-127.0.0.1}:${SHARDCACHE_DIRECT_SHARD_PORT_RANGE:-6501-6504}:${SHARDCACHE_DIRECT_SHARD_PORT_RANGE:-6501-6504}"
    environment:
      SHARDCACHE_DIRECT_SHARD_PORTS: ${SHARDCACHE_DIRECT_SHARD_PORTS:-1}
      SHARDCACHE_DIRECT_SHARD_BASE_PORT: ${SHARDCACHE_DIRECT_SHARD_BASE_PORT:-6501}
      SHARDCACHE_HANDOFF_BUFFER_BYTES: ${SHARDCACHE_HANDOFF_BUFFER_BYTES:-}
      SHARDCACHE_TOKIO_WRITER_MODE: ${SHARDCACHE_TOKIO_WRITER_MODE:-inline}
      RUST_LOG: ${RUST_LOG:-info}
    command:
      - --bind-addr
      - "0.0.0.0:${SHARDCACHE_PORT:-6380}"
      - --disable-persistence
      - --server-mode
      - direct
      - --shard-count
      - "${SHARDCACHE_SHARD_COUNT:-4}"
      - --max-connections
      - "${SHARDCACHE_MAX_CONNECTIONS:-4096}"
