[package]
name = "shardcache-client-rs"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Blocking Rust client for shardcache's native SCNP protocol"
documentation = "https://docs.rs/shardcache-client-rs"
readme = "README.md"
categories = ["caching", "database-implementations", "network-programming"]
keywords = ["shardcache", "scnp", "client", "cache", "kv"]

[features]
default = []
redis = []
tls = ["dep:rustls", "dep:rustls-pemfile"]

[dependencies]
libc = { workspace = true }
rustls = { workspace = true, optional = true }
rustls-pemfile = { workspace = true, optional = true }
thiserror = { workspace = true }
xxhash-rust = { workspace = true }
