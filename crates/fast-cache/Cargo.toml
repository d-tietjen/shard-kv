[package]
name = "fast-cache"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Embedded-first thread-per-core in-memory cache with optional RESP/FCNP server"
documentation = "https://docs.rs/fast-cache"
keywords = ["cache", "redis", "kv", "storage", "wal"]
categories = ["caching", "database-implementations"]
readme = "README.md"
autobins = false
autotests = false
autobenches = false
exclude = [".DS_Store"]

[features]
default = ["sharded"]
embedded = ["fast_cache_core/embedded"]
sharded = ["embedded", "fast_cache_core/sharded"]
redis-compat = [
    "embedded",
    "fast_cache_core/redis-compat",
]
server = ["sharded", "fast_cache_core/server", "dep:clap", "dep:tokio"]
redis-server = ["server", "redis-compat", "fast_cache_core/redis-server"]
monoio = ["server", "fast_cache_core/monoio"]
cuda = ["sharded", "fast_cache_core/cuda"]
telemetry = ["embedded", "fast_cache_core/telemetry"]
experimental-no-ttl-point-hot-path = ["fast_cache_core/experimental-no-ttl-point-hot-path"]
no-ttl = ["fast_cache_core/no-ttl"]
mutable-value-slices = ["fast_cache_core/mutable-value-slices"]
shared-parking-lot-lock = ["fast_cache_core/shared-parking-lot-lock"]
embedded-read-biased-lock = ["fast_cache_core/embedded-read-biased-lock"]
unsafe = ["fast_cache_core/unsafe"]

[dependencies]
fast_cache_core = { package = "fast-cache-core", path = "../fast-cache-core", version = "0.2.0", default-features = false }
clap = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[[bin]]
name = "fast-cache-server"
path = "src/bin/fast-cache-server.rs"
required-features = ["server"]
