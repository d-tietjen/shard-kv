[package]
name = "shardmap-blossom-bridge"
version = "0.7.1"
edition = "2024"
authors = ["Devon Tietjen <devon@eden.dev>"]
homepage = "https://github.com/d-tietjen/shard-kv"
license = "Apache-2.0"
repository = "https://github.com/d-tietjen/shard-kv"
rust-version = "1.90"
description = "Production Blossom conflict-ordering bridge for ShardMap active sync"
publish = false

[dependencies]
blossom = { git = "https://github.com/d-tietjen/blossom.git", rev = "46750a97a70fd301e3e6f3255316c1d7e837a9dd" }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
shardmap = { path = "../shardmap", version = "0.7.1", default-features = false, features = ["active-sync-consensus-ordered-eventual"] }
tokio = { version = "1.48", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = "3.15"

[workspace]
