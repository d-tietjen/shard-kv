[package]
name = "fast-cache-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Rust-native GPU/runtime integration layer for fast-cache"

[features]
default = ["embedded", "sharded"]
embedded = ["fast-cache/embedded"]
sharded = ["embedded", "fast-cache/sharded"]
cuda = ["fast-cache/cuda", "sharded", "dep:cust"]
gpu-direct-api = ["sharded"]

[dependencies]
fast-cache = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
cust = { workspace = true, optional = true }
