[package]
name = "fast-cache-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Rust-native GPU/runtime integration layer for fast-cache"

[features]
default = ["sharded"]
embedded = ["fast_cache_core/embedded"]
sharded = ["embedded", "fast_cache_core/sharded"]
cuda = ["sharded", "fast_cache_core/cuda", "dep:cust"]
gpu-direct-api = ["sharded"]

[dependencies]
fast_cache_core = { package = "fast-cache-core", path = "../fast-cache-core", version = "0.2.0", default-features = false }
serde = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
cust = { workspace = true, optional = true }
