[package]
name = "shardcache-redis"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Redis/Valkey compatibility source package for shardcache"
readme = "README.md"
publish = false

[features]
default = ["redis"]
embedded = ["shardmap/embedded"]
sharded = ["embedded", "shardmap/sharded"]
redis = ["embedded", "shardmap/redis"]
server = ["sharded", "shardmap/server"]
redis-server = ["server", "redis", "shardmap/redis-server"]

[dependencies]
shardmap = { workspace = true, default-features = false }

[lib]
path = "src/lib.rs"
