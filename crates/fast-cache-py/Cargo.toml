[package]
name = "fast-cache-py"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "PyO3 bindings for fast-cache benchmark adapters"

[features]
default = []
extension-module = ["pyo3/extension-module"]
telemetry = ["fast-cache/telemetry"]
gpu-direct-api = ["fast-cache-runtime/gpu-direct-api"]

[lib]
name = "fast_cache"
crate-type = ["cdylib"]

[dependencies]
dashmap = "6.1"
fast-cache = { workspace = true, features = ["sharded"] }
fast-cache-runtime = { path = "../fast-cache-runtime", version = "0.1.0" }
fcnp-client-rs = { workspace = true }
pyo3 = { version = "0.23", features = ["abi3-py311"] }
xxhash-rust = { workspace = true }
