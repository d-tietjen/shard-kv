[package]
name = "fast-cache-redis"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Redis/Valkey compatibility source package for fast-cache"
readme = "README.md"
publish = false

[features]
default = ["redis-compat"]
embedded = ["fast_cache_core/embedded"]
sharded = ["embedded", "fast_cache_core/sharded"]
redis-compat = ["embedded", "fast_cache_core/redis-compat"]
server = ["sharded", "fast_cache_core/server"]
redis-server = ["server", "redis-compat", "fast_cache_core/redis-server"]

[dependencies]
fast_cache_core = { package = "fast-cache-core", path = "../fast-cache-core", version = "0.2.0", default-features = false }

[lib]
path = "src/lib.rs"
