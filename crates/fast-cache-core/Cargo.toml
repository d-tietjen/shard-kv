[package]
name = "fast-cache-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Core engine, storage, protocol, and server runtime for fast-cache"
documentation = "https://docs.rs/fast-cache-core"
keywords = ["cache", "redis", "kv", "storage", "wal"]
categories = ["caching", "database-implementations"]
readme = "README.md"
autobins = false
autotests = false
autobenches = false
include = [
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "SAFETY.md",
    "fast-cache.toml.example",
    "src/**",
    "tests/**",
    "fuzz/support/**",
]

[lib]
name = "fast_cache"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(creusot)"] }

[features]
# Public product surfaces. The default build is the embedded, sharded Rust API.
# Redis/Valkey compatibility and TCP server code stay opt-in so cache-only users
# do not compile command families or networking they do not use.
default = ["sharded"]
embedded = []
sharded = ["embedded"]
redis-compat = ["embedded"]
server = [
    "sharded",
    "dep:bytes-handoff",
    "dep:clap",
    "dep:flume",
    "dep:socket2",
    "dep:tracing-subscriber",
]
redis-server = ["server", "redis-compat"]

# Runtime and platform integrations.
monoio = ["server", "dep:monoio", "bytes-handoff?/monoio"]
cuda = ["sharded"]
telemetry = ["embedded"]

# Internal/benchmark knobs. These are intentionally not part of the small public
# feature story; use them only for measured deployments or local experiments.
experimental-no-ttl-point-hot-path = ["no-ttl"]
no-ttl = []
mutable-value-slices = []
shared-parking-lot-lock = []
embedded-read-biased-lock = []
unsafe = []

[dependencies]
bytes = "1"
bytes-handoff = { version = "1.2.0", optional = true }
clap = { workspace = true, optional = true }
core_affinity = { workspace = true }
crc32fast = { workspace = true }
crossbeam-channel = { workspace = true }
crossbeam-utils = { workspace = true }
fast-telemetry = { workspace = true }
hashbrown = { workspace = true }
indextreemap = { workspace = true }
itoa = "1"
log = { workspace = true }
libc = { workspace = true }
lz4_flex = { workspace = true }
memchr = "2"
parking_lot = { workspace = true }
rblock = { workspace = true }
serde = { workspace = true }
smallvec = "1"
socket2 = { version = "0.5", features = ["all"], optional = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
xxhash-rust = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# Runtime-agnostic mpsc used by the tokio fanout acceptor. Monoio and tokio
# direct-shard workers bind their own shard-local listeners instead.
[dependencies.flume]
version = "0.11"
default-features = false
features = ["async"]
optional = true

# Linux-only monoio runtime, gated via FAST_CACHE_USE_MONOIO=1 at runtime.
[target.'cfg(target_os = "linux")'.dependencies]
monoio = { version = "0.2", optional = true }

[target.'cfg(creusot)'.dependencies]
creusot-std = "0.11.0"

[[test]]
name = "redis_tier1_coverage_test"
path = "tests/redis_tier1_coverage_test.rs"

[[test]]
name = "fuzz_harness_test"
path = "tests/fuzz_harness_test.rs"
required-features = ["redis-compat"]

[[test]]
name = "redis_compat_differential_test"
path = "tests/redis_compat_differential_test.rs"
required-features = ["redis-server"]
