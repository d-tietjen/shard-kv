name: succession qualification artifacts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/succession-qualification.yml'
      - 'scripts/qualify-cache-succession-candidates.py'

permissions:
  contents: read

jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_CACHE_AUTO_CLEAN_FREQUENCY: never
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build and test four exact candidates
        run: python3 scripts/qualify-cache-succession-candidates.py target/succession-qualification
      - name: Source restored after qualification
        if: always()
        run: git diff --exit-code -- crates/shardmap/src/succession/native.rs
      - uses: actions/upload-artifact@v4
        with:
          name: succession-candidates
          path: target/succession-qualification/
          if-no-files-found: error
          retention-days: 7
