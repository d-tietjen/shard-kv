name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: generated artifacts stay out of git
        run: |
          set -euo pipefail
          bad_files="$(
            git ls-files \
              | grep -E '(^|/)(\.DS_Store|\.claude|\.why3find|results|target|var|tmp|__pycache__|\.pytest_cache|\.mypy_cache|[^/]+\.egg-info)(/|$)|(^|/)rustc-ice-[^/]*\.txt$|\.(pyc|aux|fdb_latexmk|fls|log|out|rdb|tmp|trace|synctex\.gz)$|(^|/)texput\.log$|(^|/)perf\.data|\.xlsx$|\.pdf$' \
              || true
          )"
          if [ -n "$bad_files" ]; then
            echo "$bad_files"
            exit 1
          fi

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: install Redis reference server
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - uses: Swatinem/rust-cache@v2
      - name: TLS dependency policy
        run: ./scripts/check-tls-dependency-policy.sh
      - name: dependency inventory is fresh
        run: ./scripts/generate-dependency-docs.sh --check
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p shardmap --all-targets --all-features -- -D warnings
          cargo clippy -p shardcache --all-targets --all-features -- -D warnings
          cargo clippy -p shardcache --all-targets --no-default-features --features redis-server,redis-functions,redis-modules-all -- -D warnings
          cargo clippy -p shardcache-py --all-targets --all-features -- -D warnings
          cargo clippy -p shardcache-runtime --all-targets --features gpu-direct-api -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: test formal command laws
        run: cargo test -p shardcache-formal
      - name: test unsafe feature
        run: cargo test -p shardmap --features unsafe
      - name: test redis feature
        run: cargo test -p shardmap --features redis
      - name: test redis command coverage
        run: cargo test -p shardmap --features redis --test redis_tier1_coverage_test
      - name: test benchmark command tooling
        run: |
          cargo test -p shardcache-benchmarks --bin redis_command_matrix
          cargo test -p shardcache-benchmarks --bin redis_command_manifest
          cargo test -p shardcache-benchmarks --bin redis_command_report
          cargo test -p shardcache-benchmarks redis_command_cases::tests
      - name: redis compatibility manifest is fresh
        run: ./scripts/check-redis-compatibility-doc.sh
      - name: feature flag contract
        run: ./scripts/check-feature-matrix.sh
      - name: crates.io publish set
        run: ./scripts/check-publish-set.sh
      - name: crates.io package artifacts
        run: ./scripts/check-publish-artifacts.sh
      - name: test redis differential compatibility
        env:
          SHARDCACHE_COMPAT_SERVER_BIN: redis-server
        run: cargo test -p shardmap --features redis-server --test redis_compat_differential_test -- --nocapture
      - name: redis feature
        run: cargo check -p shardcache --features redis
      - name: redis server feature
        run: cargo check -p shardcache --features redis-server
      - name: redis compatibility feature surface
        run: cargo check -p shardcache --no-default-features --features redis-server,redis-functions,redis-modules-all
      - name: rustdoc
        run: cargo doc -p shardmap --no-deps --all-features
      - name: rustdoc facade
        run: cargo doc -p shardcache --no-deps --all-features
      - name: rustdoc shardcache client
        run: cargo doc -p shardcache-client-rs --no-deps

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: docker compose config
      - name: docker compose build
        run: docker compose build shardcache
      - name: docker compose up
        run: docker compose up -d --no-build shardcache
      - name: smoke RESP over docker compose
        run: |
          python3 - <<'PY'
          import socket
          import time

          def request(payload, expected):
              deadline = time.time() + 30
              last_error = None
              while time.time() < deadline:
                  try:
                      with socket.create_connection(("127.0.0.1", 6380), timeout=1) as sock:
                          sock.settimeout(2)
                          sock.sendall(payload)
                          data = b""
                          while expected not in data:
                              chunk = sock.recv(4096)
                              if not chunk:
                                  break
                              data += chunk
                          if expected in data:
                              return data
                          last_error = AssertionError(f"expected {expected!r}, got {data!r}")
                  except OSError as error:
                      last_error = error
                  time.sleep(0.25)
              raise RuntimeError(f"RESP smoke failed: {last_error}")

          request(b"*1\r\n$4\r\nPING\r\n", b"+PONG\r\n")
          request(
              b"*3\r\n$3\r\nSET\r\n$3\r\nfoo\r\n$3\r\nbar\r\n"
              b"*2\r\n$3\r\nGET\r\n$3\r\nfoo\r\n",
              b"+OK\r\n$3\r\nbar\r\n",
          )
          PY
      - name: docker compose logs
        if: failure()
        run: docker compose logs shardcache
      - name: docker compose down
        if: always()
        run: docker compose down --volumes --remove-orphans
